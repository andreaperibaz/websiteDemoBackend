openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
  description: API for user-related operations, including contact form submission.

servers:
  - url: http://localhost:8080/demo
    description: Local server

paths:
  /users/contactForm:
    post:
      summary: Submit a contact form
      description: Allows a user to send a message through the contact form.
      operationId: submitContactForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormDto'
      responses:
        '200':
          description: Contact form submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactFormResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid form data."

components:
  schemas:
    ContactFormDto:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          description: User's full name
          example: "John Doe"
        email:
          type: string
          format: email
          description: User's email address
          example: "john.doe@example.com"
        message:
          type: string
          description: Message content
          example: "I would like more information about your services."
        mailingList:
          type: boolean
          description: Whether the user wants to join the mailing list
          example: true

    ContactFormResponse:
      type: object
      properties:
        message:
          type: string
          description: Confirmation message
          example: "Your message has been sent successfully."
